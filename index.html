<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e18">
<title>サウザンドライブズ 〜千の人生と魔王の大地〜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070d;color:#eef0f6;font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:15px;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:#eef0f6;background:#0c101c;border:1px solid #46527a;border-radius:6px;padding:8px;width:100%;user-select:text;-webkit-user-select:text}
#app{position:relative;max-width:520px;height:100vh;height:100dvh;margin:0 auto;background:#0b0e18;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}
#top{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;font-size:12.5px;background:#141a2c;border-bottom:1px solid #2c3654;white-space:nowrap;padding-top:max(5px,env(safe-area-inset-top))}
#top span{overflow:hidden;text-overflow:ellipsis}#hloc{flex:1}#hgold{color:#f3d36b}
#cvwrap{position:relative;flex:0 0 auto;background:#000;display:flex;justify-content:center;overflow:hidden}
#cv{display:block;image-rendering:pixelated;touch-action:none;-webkit-touch-callout:none}
#banner{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none;font-weight:700;text-shadow:0 0 6px #000,0 0 3px #000;opacity:0;transition:opacity .4s}
#banner.on{opacity:1}
#pstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 6px;background:#101524}
.pm{background:#182036;border:1px solid #2f3b5e;border-radius:6px;padding:3px 5px;font-size:11px;min-width:0}
.pm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pm.dead{opacity:.45}.pm.low b{color:#ffb14a}
.bar{height:5px;background:#060912;border-radius:3px;overflow:hidden;margin:2px 0}
.bar i{display:block;height:100%;background:#46c46a}.bar.mp i{background:#4a9bea}.bar.ex i{background:#d6b23e}.bar.en i{background:#e0564d}
#ctrl{flex:1;display:flex;align-items:stretch;justify-content:space-between;gap:8px;padding:6px 10px;min-height:150px;padding-bottom:max(6px,env(safe-area-inset-bottom));--ps:176px;--bw:160px}
#ctrl.swap{flex-direction:row-reverse}
#padz{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none}
#pad{position:relative;width:var(--ps);height:var(--ps);flex:0 0 var(--ps);border-radius:27%;background:radial-gradient(circle at 50% 50%,#1c2440 0,#141a2e 62%,#10152a 100%);border:1px solid #303a5c;touch-action:none}
#pad button{position:absolute;width:34%;height:34%;padding:0;border-radius:22%;border:1px solid #5a6896;background:#27315a;font-size:calc(var(--ps)*.15);line-height:1;color:#e3e8f8;touch-action:none}
#pad button.on{background:#5a70c4;border-color:#c3ceff;color:#fff}
#pad i{position:absolute;left:38%;top:38%;width:24%;height:24%;border-radius:50%;background:#1a2140;border:1px solid #3a466e;pointer-events:none}
.pu{left:33%;top:2.5%}.pd{left:33%;top:63.5%}.pl{left:2.5%;top:33%}.pr{left:63.5%;top:33%}
#btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:var(--bw);flex:0 0 var(--bw);align-self:center}
#bAct{grid-column:1/3;height:64px!important;font-size:16px!important;background:#4a3c16!important;border-color:#a08a3c!important}
#ctrl.narrow #btns button{font-size:12px}#ctrl.narrow #bAct{font-size:15px!important}
#btns button{height:52px;border-radius:12px;border:1px solid #6a5a2a;background:#3a3016;color:#f6e7b0;font-weight:700;font-size:13px;white-space:nowrap;padding:0 2px}
#btns button:active{background:#5a4a22}#bAct{grid-column:span 2;background:#16402c!important;border-color:#2f7a55!important;color:#c8f5dd!important}
#screen{position:absolute;inset:0;background:#0b0e18;overflow-y:auto;z-index:10;-webkit-overflow-scrolling:touch}
.shead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px;background:#141a2c;border-bottom:2px solid #c9b97a;padding-top:max(8px,env(safe-area-inset-top))}
.sback{padding:8px 10px;border-radius:8px;border:1px solid #46527a;background:#1d2540;font-size:13px;white-space:nowrap}
.stitle{flex:1;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sright{font-size:12.5px;color:#f3d36b;white-space:nowrap}
.sbody{padding:8px 8px 40px}
.sp{margin:6px 2px;line-height:1.55}.sp small,.dtext small{color:#aab3cc;font-size:12px}
.sh{margin:14px 2px 4px;font-weight:700;color:#e6d595;border-left:4px solid #c9b97a;padding-left:8px}
.note{font-size:12.5px;color:#aab3cc}.gold{color:#f3d36b}.good{color:#7fe09a}.bad{color:#ff8a80}.warn{color:#ffb14a}
.sbtn{display:block;width:100%;min-height:46px;margin:5px 0;padding:8px 10px;text-align:left;border-radius:8px;border:1px solid #3b4668;background:#1a2138}
.sbtn .row{display:flex;align-items:center;min-height:28px}
.sbtn:active{background:#2b3760}.sbtn:disabled{opacity:.42}
.sbtn .bl{flex:1;font-weight:600;min-width:0}.sbtn .br{color:#f3d36b;font-size:13px;margin-left:8px;white-space:nowrap}
.sbtn .bs{display:block;font-size:12px;color:#aab3cc;margin-top:2px;line-height:1.4}
.sbtn.pri{background:#3a3016;border-color:#8a7636}.sbtn.dan{background:#3c1a1e;border-color:#8a3a40}.sbtn.ok{background:#16402c;border-color:#2f7a55}
.sgrid{display:grid;gap:6px;margin:6px 0}.sgrid .sbtn{margin:0}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.g3 .sbtn,.g4 .sbtn{text-align:center;padding:6px 4px;font-size:13.5px}.g3 .sbtn .row,.g4 .sbtn .row{justify-content:center}.g3 .bl,.g4 .bl{flex:0 1 auto}
.stabs{display:flex;gap:4px;overflow-x:auto;margin:6px 0;padding-bottom:2px}
.stabs button{flex:0 0 auto;padding:8px 12px;border-radius:16px;border:1px solid #3b4668;background:#141a2c;font-size:13px;white-space:nowrap}
.stabs button.on{background:#c9b97a;color:#1a1608;font-weight:700;border-color:#c9b97a}
.card{background:#141a2c;border:1px solid #2f3b5e;border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.55}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 12px;font-size:13.5px}.kv span{display:flex;justify-content:space-between}.kv b{font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:#2b3760;margin:0 3px 2px 0;white-space:nowrap}
#dlg{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(0,0,0,.35)}
.dbox{width:100%;margin:8px;max-height:82%;overflow-y:auto;background:#0d1122;border:2px solid #e8e2c8;border-radius:10px;padding:12px;box-shadow:0 6px 24px #000;margin-bottom:max(8px,env(safe-area-inset-bottom))}
.dtext{line-height:1.65;margin-bottom:6px;white-space:pre-line}
.dnext{text-align:right;color:#e6d595;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.dbtn{display:block;width:100%;min-height:44px;margin:6px 0 0;padding:8px 10px;border-radius:8px;border:1px solid #46527a;background:#1d2540;text-align:left;font-weight:600}
.dbtn small{display:block;font-weight:400;color:#aab3cc;font-size:12px}.dbtn:active{background:#3b4a7c}.dbtn:disabled{opacity:.42}.dbtn.cancel{background:#161a28;color:#aab3cc;text-align:center}
.drow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}.drow .dbtn{text-align:center;padding:6px 2px;margin:0}
.dnum{font-size:24px;text-align:center;font-weight:700;color:#f3d36b;margin:4px 0}
#toast{position:absolute;left:0;right:0;top:44px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#toast div{background:rgba(20,26,44,.95);border:1px solid #c9b97a;border-radius:16px;padding:6px 14px;font-size:13px;max-width:92%;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* 戦闘 */
.bt{display:flex;flex-direction:column;height:100%;min-height:100dvh}
.bten{flex:0 0 auto;min-height:150px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px 6px;padding:12px 4px 6px}
.en .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btlog{flex:1 1 auto;min-height:96px;max-height:150px;overflow-y:auto;margin:0 6px;padding:6px 8px;background:#060912;border:1px solid #2f3b5e;border-radius:8px;font-size:13.5px;line-height:1.5}
.btlog div{margin:1px 0}.btlog .dm{color:#ffcf7a}.btlog .hl{color:#7fe09a}.btlog .sy{color:#9fd0ff}
.btpt{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px}
.btpt .pm.cur{border-color:#f3d36b;box-shadow:0 0 0 1px #f3d36b}.pm .stt{font-size:10px;color:#ffb14a;min-height:12px;white-space:nowrap;overflow:hidden}
.btcmd{padding:0 6px 10px;max-height:44vh;overflow-y:auto}
.btcmd .who{font-size:13px;color:#e6d595;margin:2px 2px 4px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cb{min-height:46px;padding:6px 8px;border-radius:8px;border:1px solid #46527a;background:#1d2540;font-weight:600;text-align:left}
.cb small{display:block;font-weight:400;font-size:11px;color:#aab3cc}.cb:active{background:#3b4a7c}.cb:disabled{opacity:.4}.cb.c1{grid-column:span 2}.cb.back{background:#161a28;color:#aab3cc;text-align:center}
/* タイトル */
.title{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;background:radial-gradient(ellipse at 50% 20%,#27356a 0%,#0b0e18 65%)}
.title h1{font-size:30px;text-align:center;margin:0;letter-spacing:2px;color:#f6e7b0;text-shadow:0 2px 12px #6a5a2a}
.title .sub{text-align:center;color:#aab3cc;margin:6px 0 26px;font-size:13px}
.logo{font-size:56px;text-align:center;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{border-bottom:1px solid #263050;padding:4px 3px;text-align:left}table.t th{color:#aab3cc;font-weight:400}
.fld{margin:8px 0}.fld label{display:block;font-size:12.5px;color:#e6d595;margin-bottom:3px}.fld .hint{font-size:11.5px;color:#8f99b5;margin-top:2px;line-height:1.4}
.plrow{display:flex;gap:4px;margin:3px 0;align-items:center}.plrow select{flex:1;min-width:0}.plrow input{width:64px;flex:0 0 64px}.plrow button{flex:0 0 38px;height:38px;border-radius:6px;border:1px solid #8a3a40;background:#3c1a1e}
.mapc{display:block;width:100%;border:1px solid #2f3b5e;border-radius:6px;background:#000}
@media (orientation:landscape) and (max-height:560px){
#app{max-width:860px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr}
#top{grid-column:1/3}#cvwrap{grid-column:1;grid-row:2/4;align-items:flex-start}
#pstrip{grid-column:2;grid-row:2;grid-template-columns:1fr 1fr;align-content:start}
#ctrl{grid-column:2;grid-row:3;min-height:0;padding:2px 10px}
#btns button{height:44px}#bAct{height:50px!important}
}
/* ドット絵 */
.ic{display:inline-block;vertical-align:middle;image-rendering:pixelated;margin:-4px 3px -2px 0;border-radius:3px}
.ic.m{image-rendering:auto}
.pm .ic{float:left;margin:0 4px 0 -1px;background:#0c101c;border-radius:4px}
.mspr{image-rendering:pixelated;display:block;margin:0 auto 4px}
.lookg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.dbtn.lookb{display:block;width:auto;min-height:0;margin:0;border:1px solid #46527a;background:#1d2540;border-radius:8px;padding:5px 2px 3px;text-align:center}
.lookb:active{background:#3b4a7c}
.lookb img{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto}
.dbtn.lookb small{font-size:10px;color:#aab3cc;font-weight:400;display:block}
/* 戦闘の絵と動き */
.en{position:relative;min-width:60px;max-width:100%;text-align:center;font-size:11px}
.en .sp{position:relative;margin:0 auto;animation:bob 1.9s ease-in-out infinite}
.en .sp img{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
.en .sp .fa{animation:fa .9s steps(1) infinite}.en .sp .fb{animation:fb .9s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}@keyframes fb{0%{opacity:0}50%{opacity:1}}
@keyframes bob{50%{transform:translateY(-3px)}}
.en.hit .sp{animation:ehit .34s}
@keyframes ehit{0%{transform:translateX(0);filter:brightness(4)}20%{transform:translateX(-7px);filter:brightness(4)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}100%{transform:none}}
.en.act .sp{animation:eact .28s}
@keyframes eact{50%{transform:translateY(14px) scale(1.12)}}
.en.dead .sp{animation:edie .55s forwards}
@keyframes edie{0%{filter:brightness(4)}30%{filter:brightness(1) grayscale(1);opacity:.9;transform:scale(1.04)}100%{opacity:0;transform:scale(.6) translateY(12px);filter:grayscale(1)}}
.en.dead .nm,.en.dead .bar,.en.dead .hpn{opacity:0}.en .hpn{display:block;min-height:0}
.pmw{position:relative;min-width:0}
.pmw.hit{animation:phit .34s}
@keyframes phit{0%{transform:translateX(0);filter:brightness(1.9) saturate(2)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:none}}
.pmw.act{animation:pact .28s}
@keyframes pact{50%{transform:translateY(-7px)}}
.fnum{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-weight:900;font-size:22px;color:#fff;text-shadow:0 0 3px #000,0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 -2px 0 #000;animation:fnum .85s forwards;pointer-events:none;z-index:5;white-space:nowrap}
.pmw .fnum{font-size:18px;top:0}
.fnum.heal{color:#8dffad}.fnum.crit{color:#ffd24a;font-size:28px}
@keyframes fnum{0%{opacity:0;margin-top:8px}15%{opacity:1;margin-top:-8px}70%{opacity:1;margin-top:-22px}100%{opacity:0;margin-top:-34px}}
.fxb{position:absolute;left:50%;top:40%;width:72px;height:72px;margin:-36px 0 0 -36px;pointer-events:none;border-radius:50%;animation:fxb .45s forwards;z-index:4}
.pmw .fxb{width:56px;height:56px;margin:-28px 0 0 -28px;top:50%}
@keyframes fxb{0%{transform:scale(.3);opacity:1}60%{opacity:1}100%{transform:scale(1.25);opacity:0}}
.fx-slash{border-radius:0;background:linear-gradient(135deg,transparent 45%,#fff 48%,#fff 52%,transparent 55%),linear-gradient(45deg,transparent 46%,rgba(255,255,255,.6) 49%,rgba(255,255,255,.6) 51%,transparent 54%)}
.fx-fi{background:radial-gradient(circle,#fff 0,#ffd24a 22%,#ff6a1a 46%,rgba(255,60,0,0) 70%)}
.fx-ic{background:radial-gradient(circle,#fff 0,#b8f0ff 25%,#4ab8ff 48%,rgba(60,140,255,0) 70%)}
.fx-wi{background:radial-gradient(circle,#fff 0,#c8ffd8 25%,#4ad88a 48%,rgba(40,200,120,0) 70%)}
.fx-th{background:radial-gradient(circle,#fff 0,#fff68a 28%,#ffd200 48%,rgba(255,200,0,0) 70%)}
.fx-ea{background:radial-gradient(circle,#fff0c8 0,#d8a860 28%,#8a6030 50%,rgba(120,80,30,0) 70%)}
.fx-li{background:radial-gradient(circle,#fff 0,#fffbe0 35%,#ffe98a 52%,rgba(255,230,120,0) 72%)}
.fx-da{background:radial-gradient(circle,#1a0030 0,#5a1a9a 30%,#b060ff 50%,rgba(120,40,220,0) 70%)}
.fx-mg{background:radial-gradient(circle,#fff 0,#e0c8ff 28%,#9a8aff 50%,rgba(120,100,255,0) 70%)}
.fx-heal{background:radial-gradient(circle,rgba(255,255,255,.9) 0,#b8ffcc 30%,rgba(80,240,140,.5) 50%,rgba(80,240,140,0) 70%)}
#cvwrap.enc #cv{animation:enc .43s forwards}
@keyframes enc{0%{filter:none}20%{filter:invert(1)}40%{filter:none;transform:scale(1)}60%{filter:invert(1)}100%{filter:brightness(0);transform:scale(1.6) rotate(8deg)}}
.en .sp:before{content:'';position:absolute;left:10%;right:10%;bottom:-4px;height:12px;background:radial-gradient(ellipse at center,rgba(0,0,0,.5),rgba(0,0,0,0) 70%)}
.en.dead .sp:before{display:none}
.tpar{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:0 0 10px;min-height:70px}
.tpar img{image-rendering:pixelated;animation:bob 1.9s ease-in-out infinite}
.card .ic{margin-right:8px}
#cvwrap.hurt #cv{animation:hurt .25s}
@keyframes hurt{0%{filter:none}40%{filter:sepia(1) saturate(6) hue-rotate(-50deg)}100%{filter:none}}
.stabs{flex-wrap:wrap}
.busy{position:absolute;inset:0;z-index:90;background:rgba(8,10,20,.86);display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;color:#e8ecf8}
.spin{width:34px;height:34px;margin:0 auto 12px;border:4px solid #46527a;border-top-color:#f3d36b;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.en .lk{display:block;min-height:15px;font-size:12px;letter-spacing:1px;line-height:15px;white-space:nowrap}.en .lk b{color:#ffd24a;font-size:11px}
.lkm{color:#ffd24a}
.en.brk .sp{animation:ebrk .5s}@keyframes ebrk{0%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(4px)}60%{transform:rotate(10deg) translateY(6px)}100%{transform:rotate(0)}}

/* ---- ツリー表示 ---- */
.tcard{padding:8px 9px}
.ttitle{margin-bottom:5px;line-height:1.3}
.tline{display:flex;flex-wrap:wrap;align-items:center;row-gap:5px}
.tline.loose{gap:5px}
.tnode{display:inline-block;min-width:26px;padding:4px 7px;border-radius:9px;border:1px solid #3d4a70;background:#151b30;color:#8e9ac0;font-size:11.5px;line-height:1.25;text-align:center;font-family:inherit}
button.tnode{cursor:pointer}
.tnode.on{background:#2c4689;border-color:#9fb6ff;color:#fff}
.tnode.cur{box-shadow:0 0 0 2px #ffd76a inset}
.tnode.nx{border-color:#ffd76a;color:#ffe9a8;background:#372f12}
.tseg{display:inline-flex;align-items:center;white-space:nowrap}
.tlink{display:inline-block;flex:0 0 9px;width:9px;height:2px;background:#3d4a70}
.tnode.pip{min-width:0;width:25px;padding:4px 0}
.tlink.on{background:#9fb6ff}
.tinfo{margin-top:6px;font-size:12.5px;line-height:1.45}
.tbar{display:block;height:5px;border-radius:3px;background:#1a2138;margin:3px 0 1px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#5b7be0,#9fd0ff)}
.jtwrap{overflow:auto;max-height:56vh;border:1px solid #2b3556;border-radius:10px;background:#0d1222;margin:6px 0;-webkit-overflow-scrolling:touch}
.jtsvg{display:block}
.jtedge{fill:none;stroke:#39456a;stroke-width:1.6}
.jtedge.ok{stroke:#6f8fe0}
.jtedge.hot{stroke:#ffd76a;stroke-width:2.6}
.jttier{fill:#7783a8;font-size:9px}
.jtnode{cursor:pointer}
.jtnode rect{fill:#161c31;stroke:#3d4a70;stroke-width:1.2}
.jtname{fill:#8e9ac0;font-size:10px;text-anchor:middle;dominant-baseline:middle}
.jtmark{fill:#ffe9a8;font-size:8.5px;text-anchor:end}
.jtext{fill:#ff9d9d;font-size:8.5px}
.jtnode.can rect{stroke:#63d083}.jtnode.can .jtname{fill:#bff0cc}
.jtnode.exp rect{fill:#22305a;stroke:#6f8fe0}.jtnode.exp .jtname{fill:#dfe6ff}
.jtnode.mas rect{fill:#2c4689;stroke:#9fb6ff}.jtnode.mas .jtname{fill:#fff}
.jtnode.awk rect{fill:#5a3f8f;stroke:#d9b8ff}.jtnode.awk .jtname{fill:#fff}
.jtnode.cur rect{fill:#4a3c16;stroke:#ffd76a;stroke-width:2}.jtnode.cur .jtname{fill:#fff}

const SEASONS = ['春', '夏', '秋', '冬'];

}

const FX = {
  on() { return !!(B && B.dom && !TEST && SPEEDS[clamp(G.opts.speed + (B.auto ? 1 : 0), 0, 3)] > 0); },
  elOf(u) { if (!B || !B.dom) return null; return u.side === 'E' ? B.dom.es[B.en.indexOf(u)] : B.dom.ps[B.al.indexOf(u)]; },
  cls(u, c, ms) { const e = this.elOf(u); if (!e) return; e.classList.remove(c); void e.offsetWidth; e.classList.add(c); setTimeout(() => e.classList.remove(c), ms || 340); },
  act(u) { if (this.on()) this.cls(u, 'act', 280); },
  hit(t, d, el) { if (!this.on()) return; this.cls(t, d > 0 ? 'hit' : 'blk', 360); this.num(t, d > 0 ? d : 'ミス', B.fxCrit ? 'crit' : ''); if (d > 0) this.burst(t, el || 'slash'); B.fxCrit = 0; },
  heal(t, h) { if (!this.on()) return; this.num(t, '+' + h, 'heal'); this.burst(t, 'heal'); },
  num(t, txt, cls) { const e = this.elOf(t); if (!e) return; const n = el('span', 'fnum ' + (cls || ''), String(txt)); e.appendChild(n); setTimeout(() => n.remove(), 850); },
  burst(t, kind) { const e = this.elOf(t); if (!e) return; const b = el('span', 'fxb fx-' + kind); e.appendChild(b); setTimeout(() => b.remove(), 460); },
  async encounter() { if (TEST || !G || G.opts.speed >= 3 || G.opts.auto) return; const w = $('cvwrap'); if (!w) return; w.classList.add('enc'); await new Promise(r => setTimeout(r, 430)); w.classList.remove('enc'); }

const CARD_T = { beast: 0, dragon: 0, material: 0, humanoid: 0, bird: 1, bug: 1, aquatic: 1, jelly: 1, undead: 2, demon: 2, elemental: 2, plant: 2, metal: 2 }, CARD_JP = ['力', '技', '魔'], CARD_IC = ['💪', '🎯', '🔮'];
const Cards = {
  pow(m) { return m.lv + ({ b: 12, m: 8, g: 4, t: 3, c: 2, f: 2 }[m.arch] || 0); },
  ty(m) { return CARD_T[m.fam] || 0; },
  owned() { return DB.monList.filter(m => (G.best[m.id] && G.best[m.id][1] > 0) || G.cards[m.id]); },
  beats(a, b) { return (this.ty(a) + 1) % 3 === this.ty(b); },
  tag(m) { return `${CARD_IC[this.ty(m)]}${CARD_JP[this.ty(m)]}${this.pow(m)}`; },
  open(s) {
    UI.open(sc => {
      const T = Town.tier(s), own = this.owned().length; sc.head('🃏 魔物カード', fmt(G.gold) + 'G');
      sc.p(`<small>倒したことのある魔物が、そのままカードになる(いま ${own}種)。おたがい5枚の手札から1枚ずつ出しあい、<b>強さ</b>の大きいほうが勝ち。先に3勝で勝利。<br>💪力は🎯技に、🎯技は🔮魔に、🔮魔は💪力に強く、有利なら強さ1.5倍。<br>卓ごとに「強さの上限」があり、それより強いカードは出せない。勝つと賞金と、ときどき相手のカードをもらえる。</small>`);
      [['見習いの卓', 12 + T * 6, 50 + T * 30], ['腕自慢の卓', 30 + T * 9, 300 + T * 150], ['達人の卓', 60 + T * 9, 2000 + T * 600]].forEach(([nm, cap, fee]) => { const n = this.owned().filter(m => this.pow(m) <= cap).length; sc.btn(`${nm}(参加費 ${fmt(fee)}G)`, () => this.play(cap, fee), { dis: G.gold < fee || n < 5, sub: `強さ${cap}まで・出せるカード ${n}種${n < 5 ? '(5種以上必要)' : ''}・勝てば ${fmt(fee * 2)}G` }); });
      sc.p(`<small>カード勝負の勝ち数:${G.stat.cardW}</small>`);
    });
  },
  async play(cap, fee) {
    const sh = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const mine = this.owned().filter(m => this.pow(m) <= cap).sort((a, b) => this.pow(b) - this.pow(a)).slice(0, 14); if (mine.length < 5) return; G.gold -= fee; addMin(30);
    const hand = sh(mine).slice(0, 5); let pool = DB.monList.filter(m => !m.metal && this.pow(m) <= cap && this.pow(m) >= cap - 16); if (pool.length < 5) pool = DB.monList.filter(m => this.pow(m) <= cap).slice(-30); const opp = sh(pool).slice(0, 5), best = opp.slice().sort((a, b) => this.pow(b) - this.pow(a))[0];

    }
    if (w > l) { addGold(fee * 2); G.stat.cardW++; const msg = [`🎉 ${w}勝${l}敗で勝負に勝った!賞金 ${fmt(fee * 2)}G を手に入れた!`]; if (!(G.best[best.id] && G.best[best.id][1] > 0) && !G.cards[best.id] && chance(50)) { G.cards[best.id] = 1; msg.push(`「まいった。こいつを持っていきな。」\n${ic(best)} <b>${best.name}</b>のカードをもらった!`); } await say(msg); checkTitles(); }
    else await say(`${w}勝${l}敗……勝負に負けた。`);
  }
};

const Hammer = {
  bar(v, mx) { const n = clamp(Math.round(v / mx * 10), 0, 10); return '█'.repeat(n) + '░'.repeat(10 - n); },
  // 戻り値:0=失敗 1=成功 2=会心の出来
  async play(n, name) {
    let heat = 80, q = 0, left = Math.max(5, 8 - Math.floor(n / 4)); const wide = Math.min(8, n);
    for (; left > 0; left--) {
      const a = await ask(`🔨 <b>${name}</b>を打つ <small>(のこり${left}手)</small>\n熱さ   ${this.bar(heat, 100)} ${Math.round(heat)}\n出来ばえ ${this.bar(q, 100)} <b>${Math.round(q)}</b>/100\n<small>ぴったり100に近いほど良い出来。108をこえると割れる。冷めると打っても伸びない。</small>`, [{ l: '強く打つ', sub: '大きく進む・よく冷める' }, { l: 'ていねいに打つ', sub: 'ほどほど' }, { l: '軽く打つ', sub: '少しだけ進む' }, { l: 'ふいごで熱する', sub: '熱さ+35' }, { l: 'ここで仕上げる' }]);
      if (a === 4 || a < 0) break; if (a === 3) { heat = Math.min(100, heat + 35); continue; }
      const hm = heat >= 70 ? 1.25 : heat >= 40 ? 1 : heat >= 20 ? .6 : .3, g = [rint(17 - wide, 25 + wide), rint(10 - (wide >> 1), 13 + (wide >> 1)), rint(4, 6)][a] * hm; q += Math.max(1, g); heat = Math.max(0, heat - [22, 14, 8][a]); if (q > 108) break;
    }
    if (q > 108) { await say(`💥 打ちすぎた!刃にひびが入ってしまった……。<small>(出来ばえ ${Math.round(q)})</small>`); return 0; }
    if (q >= 97 && q <= 103) { await say(`✨ <b>会心の出来!</b>ほれぼれする仕上がりだ。<small>(出来ばえ ${Math.round(q)})</small>`); return 2; }
    if (q >= 86) { await say(`よし、いい出来だ。<small>(出来ばえ ${Math.round(q)})</small>`); return 1; }
    if (q >= 70 && chance(50)) { await say(`少し甘いが、なんとか形になった。<small>(出来ばえ ${Math.round(q)})</small>`); return 1; }
    await say(`💦 打ちこみが足りない。なまくらになってしまった……。<small>(出来ばえ ${Math.round(q)})</small>`); return 0;
  }
};

  all.filter(P => !P.req || !DB.perks[P.req]).forEach(start); all.forEach(P => { if (!seen.has(P.id)) start(P); }); return out;
};

/* ===================== 国境をわかりやすく(フィールドの境界線・地図の色分け・国名) ===================== */
const Border = {
  _c: {},
  rgb(n) { if (this._c[n]) return this._c[n]; const h = (W.nations[n] && W.nations[n].color) || '#cccccc', v = parseInt(h.slice(1), 16); return this._c[n] = [(v >> 16) & 255, (v >> 8) & 255, v & 255]; },
  rgba(n, a, k) { const c = this.rgb(n), f = k || 1; return `rgba(${Math.min(255, Math.round(c[0] * f))},${Math.min(255, Math.round(c[1] * f))},${Math.min(255, Math.round(c[2] * f))},${a})`; },
  on() { return !G || !G.opts || G.opts.border !== false; },
  /* フィールド:国がちがう陸のマスどうしの境目に、国の色の帯と破線を引く(自分の側は自分の国の色) */
  tile(c, x, y, sx, sy) {
    const S = W.S; if (x < 0 || y < 0 || x >= S || y >= S) return; const i = y * S + x; if (!TER_K[W.t[i]]) return; const n = W.nat[i];
    for (let k = 0; k < 4; k++) {
      const dx = k === 1 ? 1 : k === 3 ? -1 : 0, dy = k === 0 ? -1 : k === 2 ? 1 : 0, nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= S || ny >= S) continue; const j = ny * S + nx; if (W.nat[j] === n || !TER_K[W.t[j]]) continue;
      const hz = dy !== 0, ph = ((hz ? x : y) & 1) * 4;
      c.fillStyle = this.rgba(n, .3, 1.15); if (hz) c.fillRect(sx, dy < 0 ? sy : sy + 11, 16, 5); else c.fillRect(dx < 0 ? sx : sx + 11, sy, 5, 16);
      c.fillStyle = 'rgba(10,10,20,.8)'; if (hz) c.fillRect(sx, dy < 0 ? sy : sy + 15, 16, 1); else c.fillRect(dx < 0 ? sx : sx + 15, sy, 1, 16);
      c.fillStyle = this.rgba(n, 1, 1.3);
      for (let d = -4 + ph; d < 16; d += 8) { const a = Math.max(0, d), b = Math.min(16, d + 5); if (b <= a) continue; if (hz) c.fillRect(sx + a, dy < 0 ? sy + 1 : sy + 13, b - a, 2); else c.fillRect(dx < 0 ? sx + 1 : sx + 13, sy + a, 2, b - a); }
    }

  async newGame(custom) {

    const pk = Object.keys(PERS), ps = await ask('どんな性格ですか?<small>(成長のしかたが変わる)</small>', pk.map(k => ({ l: PERS[k][0], sub: PERS[k][1].map((v, i) => v > 1.04 ? STAT_JP[STATS[i]] + '◎' : v < .96 ? STAT_JP[STATS[i]] + '△' : '').filter(Boolean).join(' ') })), { cancel: 1 }); if (ps < 0) return;

    const md = await ask('難しさを選んでください。', [{ l: 'ノーマル', sub: '全滅しても、所持金の半分を失って教会からやり直せる' }, { l: 'ハードコア(ローグライク)', sub: '全滅したらその人生は終わり。記録は消える。緊張感を求める人に' }], { cancel: 1 }); if (md < 0) return;
    const wd = await ask('世界を選んでください。<small>(世界は番号ごとに地形がまったく変わる)</small>', ['おまかせ(ランダムな世界)', '世界の番号を自分で決める'], { cancel: 1 }); if (wd < 0) return;
    let seed = rnd(900000) + 1000; if (wd === 1) { const t = await askText('世界の番号(数字)', String(seed), 9); if (t === null) return; seed = Math.abs(parseInt(t, 10)) || seed; }
    const ms = [1, 2, 3].map(slotMeta), fr = ms.findIndex(m => !m); let slot = fr + 1;

    const done = await busy('🌍 世界を生成しています…<br><small>大陸・町・迷宮をつくっています</small>'); try { this.create({ name: name || 'アレン', sex: ['m', 'f', 'x'][sx], look, emoji: ['🧑', '👩', '🧑'][sx], origin: ORIGINS[og], pers: pk[ps], job, race, custom: !!custom, hard: md === 1, seed, slot }); } finally { done(); }
    const N = W.nations[0], h = hero();
    await say([`${dateStr()}。${N.name}、${N.cap.name}。`, `${h.name}、${G.age0}歳。${Race.id(h) !== 'human' ? Race.name(h) + 'の' : ''}${ORIGINS[og][1]}として育ったあなたは、今日、ひとり立ちの日を迎えた。`, `世界のどこかでは魔王が力を増しているという。\nけれど——勇者になるのも、商人として財を成すのも、気ままに旅をするのも、あなたの自由だ。`, custom ? `<small>【カスタムスタート】</small>\n最初の職業は <b>${esc(jobName(h))}</b>。\n<small>神殿でほかの職業に変えても、この職業にはいつでも戻れる。</small>` : '', `<small>【はじめに】\n・十字ボタンで町の中を歩ける。建物の扉へ進むと中に入れる(看板が目印)\n・「行動」→「施設の一覧」なら歩かずに入れる。「メニュー」で装備や仲間の確認\n・まずは酒場で仲間を探し、武器屋で装備を整えよう\n・北にある城の王様に会うと、最初の目的地を教えてくれる\n・くわしくは メニュー → 設定 → あそびかた</small>`]);

  /* カスタムスタート:すべての職業から最初の職業を選ぶ(系統 → 職業 → 確認) */
  async pickJob() {
    const TN = JOB_TIER, all = Object.values(DB.jobs).filter(j => JOBCAT[j.cat]), cats = Object.keys(JOBCAT).filter(k => all.some(j => j.cat === k));
    for (; ;) {
      const ci = await ask(`どの系統の職業ではじめますか?<small>(全${all.length}職。伝説職や その上の神話職・超越職も、エディタで作った職業も選べる)</small>`, cats.map(k => { const ls = all.filter(j => j.cat === k); return { l: `${JOBCAT[k][1]} ${JOBCAT[k][0]}`, sub: `${ls.length}職・` + [1, 2, 3, 4, 5, 6, 7].map(t => { const n = ls.filter(j => j.tier === t).length; return n ? TN[t].replace('職', '') + n : ''; }).filter(Boolean).join(' ') }; }), { cancel: 1 });
      if (ci < 0) return null;
      const k = cats[ci], ls = all.filter(j => j.cat === k).sort((a, b) => a.tier - b.tier);
      for (; ;) {
        const ji = await ask(`${JOBCAT[k][1]} <b>${JOBCAT[k][0]}</b><small>(${ls.length}職・下へ行くほど上の職)</small>`, ls.map(j => ({ l: `${esc(j.name)} <span class="tag">${TN[j.tier] || ''}</span>`, sub: esc(j.desc) })), { cancel: '系統を選びなおす' });
        if (ji < 0) break;
        const j = ls[ji]; let a = 1;
        while (a === 1) { a = await ask(`${JOBCAT[j.cat][1]} <b>${esc(j.name)}</b> <small>${TN[j.tier] || ''}</small>\n${esc(j.desc)}`, ['この職業ではじめる', 'くわしく見る'], { cancel: 'ほかの職業にする' }); if (a === 1) await jobInfo(j); }
        if (a === 0) return j.id;
      }
    }
  },

    const b = o.origin[3]; G.gold = b.gold || 50; STATS.forEach(k => { if (b[k]) c.base[k] += b[k]; }); if (b.fame) G.fame = b.fame; if (b.karma) G.karma = b.karma; (b.skills || []).forEach(k => learn(c, k)); for (const k in b.items) give(k, b.items[k]);

      H('野営・騎獣・誓い', '<b>野営</b>:休む前に、仲間と語らう・焚き火で料理する・星をながめる・見張りを立てる、を選べます。<br><b>騎獣</b>:馬車屋で買える相棒。外を歩く時間が短くなり、魔物に会いにくくなります。歩くほど育ち、草レースにも出られます。<br><b>誓い</b>:教会で「一人旅」「買わず」「不退転」「野宿」の誓いを立てると、経験値やお金が増えます。旅立ちから3日目までに立てて、守ったまま魔王を倒すと称号。');
      H('迷宮の変異・魔物カード・自分の店', '<b>迷宮の変異</b>:日によって迷宮に特別なルールがつきます(魔法封じ・宝の山・巨大魔物・黄金の日・魔物の群れ・静寂・深い闇)。入口で確かめられます。<br><b>魔物カード</b>:酒場で遊べます。倒した魔物がカードになり、力・技・魔の三すくみで勝負。<br><b>自分の店</b>:不動産屋で買った店の棚に持ち物を並べると、日がたつごとに売れていきます(メニューの「資産・家族」)。');
      H('依頼台帳(約2,000件)', '冒険者ギルドの「依頼台帳」には、報酬つきの依頼が約2,000件のっています。掲示板の依頼とちがって受ける必要はなく、いつでも進められます。魔物の討伐、系統ごとの討伐数、迷宮の踏破、町や村をたずねる、品物の納品、武具の収集、職業を極める、ぬしや絶景、国への貢献、さまざまな記録の10分類。条件を満たしたらギルドで報告すると、お金・ギルド貢献・種や星のメダルがもらえます。メニューの「依頼」からは、どこでも一覧を見られます。');
      H('見張り塔・師匠・魔物の巣', '<b>見張り塔</b>:のぼると、まわりの地図が大きく書きこまれます。<br><b>師匠の庵</b>:世界に6人。レベル25以上で職業を2つ極めた仲間がいれば、手合わせのあと奥義(強力な特技)を教えてくれます。<br><b>魔物の巣</b>:近くでは魔物に会いやすくなります。つぶすと魔物が減り、近くの町の店の品ぞろえが良くなります。');
      H('鍛冶・牧場・探検隊・闇市', '<b>鍛冶のたたき方</b>:装備を鍛えるとき「自分で打つ」を選ぶと、熱さを見ながら強く・ていねいに・軽く打つミニゲームになります。出来ばえをぴったり100に近づけると「会心の出来」で+2。<br><b>魔物牧場</b>:自宅で、控えの魔物を預けると素材を産み、育ち、卵も産まれます。<br><b>探検隊</b>:ギルドで、控えの仲間を2〜7日の探検に出せます。<br><b>闇市</b>:夜9時〜朝4時、町や都の「行動」から。未鑑定の骨董は、鑑定するまで価値がわかりません。');
      H('牢屋・予言・手紙', '<b>脱獄</b>:捕まったとき、刑期をつとめるかわりに脱獄をくわだてられます(錠前・見張り・城壁の3つの関門)。<br><b>予言</b>:転移の祠で聞けます。期日までに果たしても、くつがえしても、それぞれ報いがあります。<br><b>手紙</b>:旅先で助けた人や家族、国やギルドから、伝書鳩で手紙と贈りものが届きます。');
      H('食べ歩き・歌・潜入・博物館', '<b>名物料理</b>:酒場で、その国・その土地(都・町・村)の名物を食べられます。食べ歩き手帳がうまると記念品。<br><b>冒険の歌</b>:酒場で、これまでの冒険が歌になります。新しい手柄があるほど、おひねりがふえます。<br><b>潜入の仕事</b>:ギルドで受ける裏の仕事。4つの関門を、見つからずに進みます。<br><b>博物館</b>:都の「行動」から。旅先で見つけた遺物(24種)を寄贈すると、展示がふえてお礼がもらえます。');
      H('海・季節・空', '<b>潜水</b>:港で潜水具を買うと、船の上からもぐれます。沈没船(18か所)には宝が眠っています。<br><b>季節の渡り魔物</b>:春夏秋冬それぞれ8種。その季節に外を歩くと、ときどき群れに出会います。<br><b>月と空</b>:月は30日で満ち欠けします。満月の夜は獣・不死・悪魔が強くなり、新月の夜は魔物に気づかれにくくなります。年に3回の流星群、年に1回(6月1日)の日食もあります。日食の日は、祠の黒い扉がひらきます。');
      H('武器・ライバル・夢', '<b>愛用の武器</b>:同じ武器で勝ちつづけると育ち、ダメージがふえます(最高で「魂の」武器)。<br><b>ライバル</b>:同じ世界を旅する一行。道中で勝負をいどまれたり、助けられたり、手を組んだりします。<br><b>夢の世界</b>:宿屋で眠ると、ときどき夢の迷宮への扉が現れます。中で倒れても何も失いません。');
      H('山・空・地下の道', '<b>登山</b>:馬車屋で登山道具を買うと、山岳・雪山・火山を歩いて登れます(体力をうしないます)。山頂(12か所)には宝。<br><b>気球</b>:町や都の馬車屋から、行ったことのある町へ飛べます。<br><b>地下道</b>:8か所の入口が2つずつつながり、山の向こうの国へ抜けられます。<br><b>幻の里</b>:霧の日か満月の夜にだけ現れます。<br><b>季節の地形</b>:冬は岸ぞいの海が凍って歩け、春は草原に花が咲きます。');
      H('幻獣・研究・称号・性格・呪い', '<b>幻獣</b>:酒場の噂や道ばたの足あとを3回たどると出会えます。<br><b>魔物の研究</b>:同じ魔物を5・20・50体倒すと、HPが見える・ダメージ増・落とし物増。<br><b>名乗る称号</b>:手帳の「探索」から、称号をひとつ名乗れます。それぞれ小さな効果つき。<br><b>性格の変化</b>:行いによって、主人公の性格が変わることがあります(受け入れるかは選べます)。<br><b>呪いの装備</b>:強いが呪われた品が3つ。それぞれ決まった行いで浄化でき、さらに強い品に生まれ変わります。<br><b>地図屋</b>:ギルドで、歩いた地図を買い取ってもらえます。');
      H('戦いの工夫', '<b>戦場の地形</b>:外での戦いは、いる場所の地形が効きます(森はよけやすい、沼は動きにくい、溶岩は火が強く毎ターン熱でダメージ、など)。戦闘の最初に表示されます。<br><b>絆の連携</b>:信頼度70以上の仲間は、ときどき追い打ちをし、80以上なら倒れそうな仲間をかばいます。<br><b>連戦の塔</b>:闘技場から。回復なしで15階の強敵に挑み、階数とターン数の記録を残します。<br><b>道場破り</b>:8つの道場で、主人公ひとりの一騎打ち。');
      H('くらしの広がり', '<b>隊商ルート</b>:馬車屋で、2つの町を結ぶ自分の交易路をひらけます。<br><b>種のかけ合わせ</b>:自宅の畑で。黄金果どうしから、まれに「星の実の苗」。<br><b>ペット</b>:道ばたで出会うと連れていけます。ときどき物を見つけてきます。<br><b>公共事業</b>:ギルドで寄付すると、街道や橋ができます。<br><b>仕立て屋</b>:町や都の「行動」から。服と髪を染められます。<br><b>お尋ね者</b>:ギルドで手配書を受け取り、酒場の聞きこみで居場所をしぼりこんで踏みこみます。');
      H('国と仲間', '<b>王の勅命</b>:城で王に会うと、国ごとに3つの務めを頼まれます。すべて果たすと、その国の行く末(商い・守り・学問)を決められます。<br><b>土地の浄化</b>:魔将を倒した国の都の教会で、魔窟のまわりの土地を清められます。<br><b>領地</b>:どこかの国で男爵以上になると、村をひとつさずかります(メニューの「資産・家族」)。税と建物を決めて育てます。<br><b>仲間の離脱</b>:信頼を失った仲間は去っていきます(全滅や悪い行いで信頼は下がります)。旅先で再会し、和解も決別もできます。');
      H('世界のひみつと遊び', '<b>伝承の本</b>:町の探索や宝箱で見つかる20冊。世界のなりたちと、隠し場所の手がかり。<br><b>謎かけ老人</b>:9人。答えは旅の中にあります。<br><b>異界の門</b>:3つの門の先に、海の底・巨人・鏡の世界。<br><b>すごろく・魔物かけっこ</b>:カジノで。自分の魔物を出走させることもできます。<br><b>旗印</b>:手帳の「探索」から、8×8のドット絵で一行の紋章をえがけます。冒険者カードと船の帆に出ます。');

    });

};
/* ===================== 入力と起動 ===================== */
function boot() {
  loadCustom(); initDB();
  Ctl.init();
  $('bMenu').onclick = () => Field.menu(); $('bAct').onclick = () => Field.act(); $('bMap').onclick = () => Field.map();
  const KEY = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
  document.addEventListener('keydown', e => { if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; const k = KEY[e.key]; if (k) { e.preventDefault(); Field.move(k[0], k[1]); } else if (e.key === 'Enter' || e.key === ' ') { if (Dlg.open) { const d = $('dlg'); if (d.onclick) d.onclick(); } else Field.act(); } else if (e.key === 'm' || e.key === 'Escape') { if (!UI.stack.length) Field.menu(); } });
  window.addEventListener('resize', () => { if (G) Field.resize(); else { const cv = $('cv'); if (cv) Field.resize(); } });
  setInterval(() => { if (G && !document.hidden) G.play++; }, 1000);
  Field.resize(); if (typeof requestAnimationFrame === 'function') { Field.anim = true; Field.loop(); } Title.open();
}
if (typeof document !== 'undefined') { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot(); }
